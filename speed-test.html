<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed of Light Test</title>
<link rel="stylesheet" href="base.css">
<style>
  #test-canvas {
    border: 1px solid #446;
    border-radius: 4px;
    display: block;
    margin: 0 auto 12px;
  }
  #test-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  #test-status {
    text-align: center;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 12px;
  }
  #test-status span { color: #fff; }
  #test-status .tunneled { color: #f44; }
  #test-status .safe { color: #8f8; }
  #results-panel {
    max-width: 700px;
    margin: 0 auto;
    background: #111128;
    border: 1px solid #335;
    border-radius: 6px;
    padding: 12px 16px;
  }
  #results-panel h2 {
    font-size: 0.9rem;
    color: #8af;
    margin-bottom: 8px;
  }
  #results-log {
    font-size: 0.75rem;
    color: #aaa;
    max-height: 300px;
    overflow-y: auto;
    line-height: 1.5;
  }
  #results-log .tunneled { color: #f44; font-weight: bold; }
  #results-log .safe { color: #8f8; }
  #results-log .summary { color: #ff0; font-weight: bold; }
</style>
</head>
<body>

<h1>⚡ Speed of Light Test</h1>

<div id="test-controls">
  <a href="index.html" style="color:#8af;text-decoration:none;font-size:0.8rem;padding:6px 12px;border:1px solid #446;border-radius:4px;">← Back to Sim</a>
  <button id="btn-start-single">▶ Start Single Block</button>
  <button id="btn-start-multi">▶ Start 5-Block</button>
  <button id="btn-stop-test">■ Stop</button>
</div>

<div id="test-status">Ready — click a test button to begin</div>

<canvas id="test-canvas" width="700" height="60"></canvas>

<div id="results-panel">
  <h2>Results</h2>
  <div id="results-log"></div>
</div>

<script src="state.js"></script>
<script src="connections.js"></script>
<script src="chain.js"></script>
<script src="chain-physics.js"></script>
<script src="render-helpers.js"></script>
<script src="speed-test.js"></script>
</body>
</html>
